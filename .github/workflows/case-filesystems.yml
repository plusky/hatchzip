# Throwaway, on a scratch branch of the fork only: never part of a pull request.
name: case filesystems

on:
  push:
    branches: [ci/case-filesystems]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # Keeps debug_assertions, so the crash knobs work, at a usable speed.
      CARGO_PROFILE_DEV_OPT_LEVEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y btrfs-progs xfsprogs f2fs-tools dosfstools e2fsprogs
      - run: sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
      - run: uname -a
      - run: cargo build -p hatchzip --locked
      - run: bash .github/fs-probe.sh
